    <!-- Modern non-deprecated form (Chromium flagged apple-mobile-web-app-capable

    <link rel="icon" type="image/svg+xml" href="/binaural-therapy/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/binaural-therapy/pwa-icons/apple-icon-180.jpg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/binaural-therapy/pwa-icons/apple-icon-180.jpg"
    />

      name="description"
      content="State-transitioning binaural beats and colored noise for sleep, relaxation, and focus. Designed iOS-first."
    />

    <meta property="og:title" content="Binaural Therapy" />
    <meta
      property="og:description"
      content="State-transitioning binaural beats and colored noise. iOS-first PWA."
    />
